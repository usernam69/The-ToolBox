name: 🐞 Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Tip: in The ToolBox, open the menu, press **?** and click **Copy a bug report**, then paste it below. It includes the version and recent errors."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Which app or tool?
      placeholder: e.g. Parkour, Bills, the main menu
  - type: dropdown
    id: where
    attributes:
      label: Where were you using it?
      options: [Website / installed web app, Windows app (exe), Chromebook (Linux AppImage), Chrome extension, Phone]
  - type: textarea
    id: report
    attributes:
      label: Bug report from the app (optional)
      render: text
