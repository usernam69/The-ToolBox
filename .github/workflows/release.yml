name: Build release
# Push a tag like v1.2.0 (or run it by hand) to build the Windows exe and the Linux AppImages
# (for Chromebooks with Linux turned on) and attach them to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: toolbox-desktop } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build -- --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: toolbox-desktop/dist/UsefulToolbox.exe }
  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: toolbox-desktop } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: toolbox-desktop/dist/*.AppImage }
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp toolbox/apps/registry.js toolbox-extension/ && cd toolbox-extension && zip -r ../TheToolBox-extension.zip .
      # the whole web app in one zip: unzip it on a USB stick and open index.html, no internet needed
      - run: cd toolbox && zip -r ../TheToolBox-web.zip .
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: 'TheToolBox-*.zip' }
  release:
    needs: [windows, linux, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      # every download must be there before anything is published
      - name: Check all files were built
        run: |
          ls -la out
          for f in UsefulToolbox.exe TheToolBox-x86_64.AppImage TheToolBox-arm64.AppImage TheToolBox-extension.zip; do
            [ -s "out/$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done
      # warn when a download grew by more than a fifth since the last release
      - name: Compare download sizes
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh api "repos/${{ github.repository }}/releases/latest" --jq '.assets[] | "\(.name) \(.size)"' > old.txt 2>/dev/null || true
          while read -r name size; do
            [ -f "out/$name" ] || continue; new=$(stat -c %s "out/$name")
            echo "$name: $size -> $new bytes"
            [ "$new" -gt $(( size * 6 / 5 )) ] && echo "::warning::$name grew from $size to $new bytes"
          done < old.txt; true
      # checksums so people can check a download wasn't changed
      - run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: The ToolBox ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          files: out/*
          generate_release_notes: true
          body: |
            - **Windows:** download `UsefulToolbox.exe` and double-click it (no install needed).
            - **Chromebook:** easiest is to open https://usernam69.github.io/The-ToolBox/ in Chrome and click Install. With Linux turned on, `TheToolBox-x86_64.AppImage` (Intel/AMD) or `TheToolBox-arm64.AppImage` (ARM) also runs, including Wi-Fi hosting.
            - **No internet / USB stick:** unzip `TheToolBox-web.zip` and open `index.html`.
            - **Check a download:** compare its SHA-256 with `SHA256SUMS.txt`.
            - **Chrome extension:** unzip `TheToolBox-extension.zip`, open `chrome://extensions`, turn on Developer mode and click **Load unpacked**.
