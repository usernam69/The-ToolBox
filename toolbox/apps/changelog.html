<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>What's changed</title><link rel="stylesheet" href="common.css">
<style>.ver{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0 0 18px}.ver h3{margin:0}.ver.now h3::after{content:' · you have this';font-size:13px;color:var(--muted);font-weight:400}
.ver ul{margin:6px 0 0;padding-left:20px}.dl{font-size:13px}.comic{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.panel{border:3px solid var(--ink);border-radius:6px;padding:10px;background:var(--card)}.panel .who{font-size:40px}.panel .bub{background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:6px 10px;margin-top:6px;font-size:14px}.haiku{font-style:italic;white-space:pre-line;margin:6px 0 0}mark{border-radius:3px}</style></head>
<body data-app="changelog" data-cat="tools" data-title="What's changed"><main>
<p class="sub">Every version of The ToolBox and what it brought. Older versions can still be opened from their release page.</p>
<div class="row"><input id="q" class="grow" placeholder="Search every version…" aria-label="Search the changelog"><select id="view" aria-label="View"><option value="list">📜 List</option><option value="comic">💬 Comic</option><option value="haiku">🎋 Haiku</option></select><a class="g" href="../changelog.xml" title="Follow new versions in a feed reader">📡 RSS</a></div><div id="list"></div><p class="muted" id="gh"></p>
<p id="builds" class="muted"></p><p class="muted"><label><input type="checkbox" id="countMe"> Count this device</label> <span id="count"></span></p>
<h3>🗳️ What should come next?</h3><p class="muted">One vote per device, change it any time. Votes are public and anonymous.</p><div id="poll"></div>
</main><script src="common.js"></script><script src="scores.js"></script><script>
// the list ships with the app (errors.js) so it works offline; online, GitHub adds download links
const split=t=>t.split(/,\s+|\.\s+/).map(s=>s.replace(/\.$/,'').trim()).filter(Boolean);
let REL={};const FACES=["🦊","🐸","🤖","🐙","🦉","🐝","🐢","🦄"];
// a rough 5-7-5: count vowel groups as syllables and break the words into three lines
const syl=w=>Math.max(1,(w.toLowerCase().replace(/e$/,'').match(/[aeiouy]+/g)||[]).length);
function haiku(t){const w=t.replace(/[^\w'’ -]/g,' ').split(/\s+/).filter(Boolean),out=[[],[],[]];let i=0,n=0;const goal=[5,7,5];for(const x of w){if(i>2)break;out[i].push(x);n+=syl(x);if(n>=goal[i]){i++;n=0}}return out.map(l=>l.join(' ')).filter(Boolean).join('\n')}
function draw(rel=REL){REL=rel;const q=$('q').value.trim().toLowerCase(),view=$('view').value,rows=TB_NEWS.filter(([v,t])=>!q||(v+' '+t+' '+TB_CODENAME(v)).toLowerCase().includes(q));
  $('list').className=view==='comic'?'comic':'';if(!rows.length){$('list').innerHTML='<p class="muted">Nothing matches.</p>';return}
  if(view==='comic'){$('list').innerHTML=rows.map(([v,t],i)=>`<div class="panel"><b>v${esc(v)} · ${esc(TB_CODENAME(v))}</b><div class="who">${FACES[i%FACES.length]}</div><div class="bub">${esc(split(t)[0])}!</div></div>`).join('');return}
  $('list').innerHTML=rows.map(([v,t])=>{const r=rel[v];
  return`<div class="ver ${v===TB_VERSION?'now':''}"><h3>${esc(v)} <span class="muted" style="font-weight:400;font-size:14px">“${esc(TB_CODENAME(v))}”</span></h3>${view==='haiku'?`<p class="haiku">${esc(haiku(t))}</p>`:`<ul>${split(t).map(s=>`<li>${esc(s[0].toUpperCase()+s.slice(1))}</li>`).join('')}</ul>`}
   ${r?`<div class="dl"><a href="${esc(r.url)}" target="_blank" rel="noopener">Release page and downloads</a>${v!==TB_VERSION?` · <a href="https://raw.githack.com/usernam69/The-ToolBox/v${esc(v)}/toolbox/index.html" target="_blank" rel="noopener" title="Opens that version in a new tab. It keeps its own separate data.">▶ Try this version</a>`:''} · ${new Date(r.date).toLocaleDateString()}</div>`:''}</div>`}).join('')}
(function wait(){if(!window.TB_NEWS)return setTimeout(wait,50);$('q').oninput=$('view').onchange=()=>draw();draw();
  fetch('https://api.github.com/repos/usernam69/The-ToolBox/releases?per_page=30').then(r=>r.ok?r.json():[]).then(list=>{const rel={};
    list.forEach(r=>{const v=String(r.tag_name).replace(/^v/,'');rel[v]={url:r.html_url,date:r.published_at}});draw(rel);
    const newest=list.find(r=>!r.prerelease&&/^v?\d/.test(r.tag_name));if(newest){const v=newest.tag_name.replace(/^v/,'');
      $('gh').innerHTML=v!==TB_VERSION&&!TB_NEWS.some(n=>n[0]===v)?`✨ Version ${esc(v)} is out. <a href="${esc(newest.html_url)}" target="_blank" rel="noopener">See what's new</a>, or reload the page to update.`:''}}).catch(()=>{})})();
// each device's vote is its own retained message, so votes can't overwrite each other and anyone can count them
const POLL=['More games','More tools','Better online play','A phone app','More themes and looks','Faster and smaller'],PT='the-toolbox/v1/poll/next/',votes={};
const me=load('pollId',null)||Math.random().toString(36).slice(2,12);save('pollId',me);let pc=null;
function drawPoll(){const n=POLL.map((_,i)=>Object.values(votes).filter(v=>v===i).length),tot=n.reduce((a,b)=>a+b,0)||1,mine=votes[me];
  $('poll').innerHTML=POLL.map((o,i)=>`<button class="g" data-v="${i}" style="display:block;width:100%;text-align:left;margin:4px 0;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 30%,transparent) ${n[i]/tot*100}%,transparent 0)${mine===i?';font-weight:700':''}">${mine===i?'✔ ':''}${esc(o)} <span class="muted">${n[i]}</span></button>`).join('')+(pc?'':'<p class="muted">Connecting…</p>');
  $('poll').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(!pc)return toast('Not connected.');votes[me]=+b.dataset.v;pc.publish(PT+me,String(votes[me]),{retain:true,qos:1});drawPoll()})}
// build status: the latest runs on GitHub (needs the internet)
fetch('https://api.github.com/repos/usernam69/The-ToolBox/actions/runs?per_page=6').then(r=>r.ok?r.json():null).then(j=>{if(!j)return;const runs=j.workflow_runs||[],ic={success:'✅',failure:'❌',cancelled:'⚪'};
  $('builds').innerHTML='Latest builds: '+runs.map(r=>`<a href="${esc(r.html_url)}" target="_blank" rel="noopener" title="${esc(r.name)}">${r.status!=='completed'?'⏳':ic[r.conclusion]||'❔'} ${esc(r.name)}</a>`).join(' · ')}).catch(()=>{});
// "Count this device" (off unless ticked): a random id says it runs this version, nothing else; untick to remove it
let CT='';const counted=new Set();$('countMe').checked=load('countMe',false);
function drawCount(){$('count').textContent=counted.size?`· ${counted.size} device${counted.size>1?'s':''} counted on v${TB_VERSION}`:''}
$('countMe').onchange=()=>{save('countMe',$('countMe').checked);if(!pc)return;if($('countMe').checked){pc.publish(CT+me,'1',{retain:true,qos:1});counted.add(me)}else{pc.publish(CT+me,'',{retain:true,qos:1});counted.delete(me)}drawCount()};
(function w2(){if(!window.TB_VERSION)return setTimeout(w2,50);CT='the-toolbox/v1/count/'+TB_VERSION+'/';drawPoll();WORLD.connect().then(c=>{pc=c;c.on('message',(t,buf)=>{if(!t.startsWith(PT))return;const id=t.slice(PT.length),v=+new TextDecoder().decode(buf);if(/^\w{1,16}$/.test(id)&&v>=0&&v<POLL.length)votes[id]=v;drawPoll()});c.subscribe(PT+'+');c.subscribe(CT+'+');c.on('message',(t,buf)=>{if(!t.startsWith(CT))return;const id=t.slice(CT.length);if(buf.length)counted.add(id);else counted.delete(id);drawCount()});if(load('countMe',false)){c.publish(CT+me,'1',{retain:true,qos:1});counted.add(me);drawCount()}drawPoll()}).catch(()=>{$('poll').innerHTML='<p class="muted">The poll needs the internet.</p>'});})();
</script></body></html>
