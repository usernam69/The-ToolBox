<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tic-tac-toe</title><link rel="stylesheet" href="common.css">
<style>.arc-c{display:block;margin:8px auto;background:#111;border-radius:10px;max-width:100%;touch-action:none}.arc-hud{text-align:center;font-weight:700;margin:6px 0}#t{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;margin:auto}#t button{aspect-ratio:1;font:800 44px system-ui;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}</style></head>
<body data-app="tictactoe" data-cat="games" data-title="Tic-tac-toe"><main>
<p class="sub">Play a friend on this screen, the computer, or someone online with a code.</p>
<div class="row" style="justify-content:center"><select id="mode"><option value="cpu">vs computer</option><option value="local">2 players here</option><option value="net">online</option></select><button class="g" id="go">New game</button></div><div id="room" hidden></div><p class="arc-hud" id="hud"></p><div id="t"></div>
<div id="world"></div>
</main><script src="common.js"></script><script src="scores.js"></script><script src="arcade.js"></script><script>
{
const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let b,turn,me='X',done;
const win=s=>{for(const [a,c,d] of W)if(s[a]&&s[a]===s[c]&&s[a]===s[d])return s[a];return s.every(Boolean)?'draw':null};
const R=ARC.room('ttt',m=>{if(m.t==='move'){put(m.i,true)}if(m.t==='new'){reset();me='O';draw()}},{onJoin:()=>{if(R.host){reset();me='X';R.send({t:'new'});draw()}}});
function reset(){ARC.hideOver();b=Array(9).fill('');turn='X';done=false}
function draw(){$('t').innerHTML=b.map((v,i)=>`<button data-i="${i}">${v}</button>`).join('');const w=win(b);
  $('hud').textContent=w?(w==='draw'?'Draw!':w+' wins!'):($('mode').value==='net'?(turn===me?'Your turn ('+me+')':'Their turn'):turn+' to play');if(w&&!done){done=true;if(w===me&&$('mode').value!=='local')save('wins',load('wins',0)+1)}}
function best(s,p){const w=win(s);if(w==='O')return 1;if(w==='X')return -1;if(w)return 0;let v=p==='O'?-2:2;s.forEach((x,i)=>{if(x)return;s[i]=p;const r=best(s,p==='O'?'X':'O');s[i]='';v=p==='O'?Math.max(v,r):Math.min(v,r)});return v}
function put(i,remote){if(done||b[i])return;const mode=$('mode').value;if(mode==='net'&&!remote&&turn!==me)return;b[i]=turn;turn=turn==='X'?'O':'X';tone(500,.05);if(mode==='net'&&!remote)R.send({t:'move',i});draw();
  if(mode==='cpu'&&turn==='O'&&!win(b)){let bi=-1,bv=-3;b.forEach((x,j)=>{if(x)return;b[j]='O';const v=best(b,'X')+Math.random()*.1;b[j]='';if(v>bv){bv=v;bi=j}});setTimeout(()=>put(bi),300)}}
$('t').onclick=e=>{const x=e.target.closest('[data-i]');if(x)put(+x.dataset.i)};$('mode').onchange=()=>{$('room').hidden=$('mode').value!=='net';me='X';reset();draw()};$('go').onclick=()=>{reset();if($('mode').value==='net')R.send({t:'new'});me='X';draw()};reset();draw();ARC.board('tictactoe',{key:'wins',unit:' wins'});
}
</script></body></html>
