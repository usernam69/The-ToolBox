<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Color palettes</title><link rel="stylesheet" href="common.css">
<style>#pal{display:flex;height:calc(100vh - 230px);min-height:300px;border-radius:14px;overflow:hidden}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:16px;gap:6px;cursor:pointer;transition:flex .2s}.sw:hover{flex:1.3}.sw b{font:600 18px ui-monospace,monospace}.sw button{background:rgba(255,255,255,.25);border:0;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:18px;color:inherit}@media(max-width:600px){#pal{flex-direction:column;height:auto}.sw{min-height:90px;flex-direction:row;justify-content:space-between}}.saved{display:flex;height:34px;border-radius:8px;overflow:hidden;cursor:pointer;flex:1;min-width:160px}.saved div{flex:1}</style></head>
<body data-app="palette" data-cat="quick" data-title="Color palettes"><main>
<div class="row"><button class="b" id="gen">New palette (Space)</button><select id="mode"><option value="any">Any harmony</option><option value="analogous">Analogous</option><option value="complement">Complementary</option><option value="triad">Triad</option><option value="mono">One color</option><option value="pastel">Pastel</option></select><button class="g" id="saveP">♥ Save</button><button class="g" id="css">Copy as CSS</button><span class="muted" style="font-size:13px">Click a color to copy it. 🔒 keeps it on the next roll.</span></div>
<div id="pal"></div><h3>Saved palettes</h3><div class="row" id="saved"></div>
</main><script src="common.js"></script><script>
const hsl2hex=(h,s,l)=>{s/=100;l/=100;const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l),c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(c*255).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)};
const lumOf=h=>{const[r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*r+.7152*g+.0722*b};
let cols=[...Array(5)].map(()=>({h:'#888888',lock:false}));
function gen(){let m=$('mode').value;if(m==='any')m=pick(['analogous','complement','triad','mono','pastel']);const base=rnd(360);
  const hues={analogous:[0,20,40,-20,60],complement:[0,180,10,190,0],triad:[0,120,240,0,120],mono:[0,0,0,0,0],pastel:[0,60,120,200,280]}[m];
  cols=cols.map((c,i)=>c.lock?c:{lock:false,h:hsl2hex((base+hues[i]+360)%360,m==='pastel'?45+rnd(20):m==='mono'?50+rnd(30):45+rnd(45),m==='pastel'?78+rnd(10):m==='mono'?20+i*15:25+rnd(55))});draw()}
function draw(){$('pal').innerHTML=cols.map((c,i)=>`<div class="sw" data-i="${i}" style="background:${c.h};color:${lumOf(c.h)>.4?'#111':'#fff'}"><b>${c.h.toUpperCase()}</b><button data-lock="${i}" title="Lock">${c.lock?'🔒':'🔓'}</button></div>`).join('');
  $('pal').querySelectorAll('.sw').forEach(s=>s.onclick=e=>{if(e.target.dataset.lock!==undefined){cols[e.target.dataset.lock].lock=!cols[e.target.dataset.lock].lock;draw()}else copy(cols[s.dataset.i].h.toUpperCase())})}
function drawSaved(){const s=load('saved',[]);$('saved').innerHTML=s.map((p,i)=>`<div class="saved" data-i="${i}" title="Click to load, right-click to delete">${p.map(h=>`<div style="background:${h}"></div>`).join('')}</div>`).join('')||'<span class="muted">None yet. Press ♥ Save.</span>';
  $('saved').querySelectorAll('.saved').forEach(d=>{d.onclick=()=>{cols=s[d.dataset.i].map(h=>({h,lock:false}));draw()};d.oncontextmenu=e=>{e.preventDefault();s.splice(d.dataset.i,1);save('saved',s);drawSaved()}})}
$('gen').onclick=gen;$('saveP').onclick=()=>{const s=load('saved',[]);s.unshift(cols.map(c=>c.h));save('saved',s.slice(0,40));drawSaved();toast('Saved ♥')};
$('css').onclick=()=>copy(':root{\n'+cols.map((c,i)=>`  --color-${i+1}: ${c.h};`).join('\n')+'\n}');
addEventListener('keydown',e=>{if(e.key===' '&&document.activeElement.tagName!=='SELECT'){e.preventDefault();gen()}});gen();drawSaved();
</script></body></html>
