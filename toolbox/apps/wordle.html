<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your own Wordle</title><link rel="stylesheet" href="common.css">
<style>#board{display:grid;gap:6px;justify-content:center;margin:12px 0}.r{display:grid;gap:6px}.t{width:min(13vw,56px);height:min(13vw,56px);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 26px system-ui;text-transform:uppercase;border-radius:6px}
.t.f{border-color:var(--muted)}.t.g{background:#538d4e;border-color:#538d4e;color:#fff}.t.y{background:#c9b458;border-color:#c9b458;color:#fff}.t.n{background:#787c7e;border-color:#787c7e;color:#fff}.t.pop{animation:pop .25s}@keyframes pop{50%{transform:scale(1.12)}}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#kb{display:flex;flex-direction:column;gap:6px;align-items:center}#kb div{display:flex;gap:4px}#kb button{min-width:min(8.4vw,40px);height:52px;border:0;border-radius:6px;background:var(--line);color:var(--ink);font:600 15px system-ui;cursor:pointer;text-transform:uppercase}#kb button.g{background:#538d4e;color:#fff}#kb button.y{background:#c9b458;color:#fff}#kb button.n{background:#787c7e;color:#fff}</style></head>
<body data-app="wordle" data-cat="games" data-title="Your own Wordle"><main>
<div class="row"><select id="list"></select><button class="g" id="edit">✎ My words</button><button class="b" id="newg">New word</button><span class="muted" id="stats" style="margin-left:auto"></span></div>
<div id="custom" class="box" hidden><p class="sub">Paste words about anything you like (a hobby, a game, a subject). Each word can be 4 to 7 letters and needs at least 5 entries. Any word is accepted as a guess.</p><textarea id="cw" placeholder="creeper&#10;zombie&#10;potion&#10;…"></textarea><button class="b" id="cwSave">Save list</button></div>
<div id="board"></div><div id="msg" style="text-align:center;min-height:1.5em;font-weight:600"></div><div id="kb"></div>
<div id="world" style="margin-top:14px"></div></main><script src="common.js"></script><script src="scores.js"></script><script>
const LISTS={Animals:'tiger zebra panda koala otter camel horse sheep goose eagle shark whale moose bison llama lemur sloth gecko hippo rhino',Food:'pizza pasta bread mango apple lemon grape bacon salad sushi tacos curry steak honey melon peach chili toast olive cream',
 Gaming:'level quest sword armor potion spawn craft block steve skins loot pixel arena combo match score chest diamond boss',Space:'orbit comet earth venus pluto lunar solar rocket alien stars nova galaxy saturn mars probe crater',Sports:'goal score pitch coach court match point dunk serve skate surf swim relay medal'};
function lists(){return{...LISTS,...(load('custom','').trim()?{'My words':load('custom','')}:{})}}
function fillLists(){const l=lists();$('list').innerHTML=Object.keys(l).map(k=>`<option>${k}</option>`).join('');$('list').value=load('list','Animals')in l?load('list','Animals'):'Animals'}
let answer='',rows=[],cur='',over=false;
function words(){return lists()[$('list').value].toLowerCase().split(/[\s,]+/).filter(w=>/^[a-z]{4,7}$/.test(w))}
function newGame(){const w=words();if(w.length<5){$('msg').textContent='That list needs at least 5 words of 4–7 letters.';return}answer=pick(w);rows=[];cur='';over=false;$('msg').textContent='';draw()}
function score(g){const r=Array(g.length).fill('n'),a=[...answer];[...g].forEach((ch,i)=>{if(ch===a[i]){r[i]='g';a[i]=null}});[...g].forEach((ch,i)=>{if(r[i]!=='g'){const j=a.indexOf(ch);if(j>=0){r[i]='y';a[j]=null}}});return r}
function draw(){const L=answer.length;$('board').innerHTML=[...Array(6)].map((_,i)=>{const g=rows[i]||(i===rows.length?cur:''),sc=rows[i]?score(rows[i]):null;
  return`<div class="r" style="grid-template-columns:repeat(${L},auto)">${[...Array(L)].map((_,j)=>`<div class="t ${sc?sc[j]:g[j]?'f':''}">${g[j]||''}</div>`).join('')}</div>`}).join('');
  const kb={};rows.forEach(r=>score(r).forEach((s,i)=>{const k=r[i],o={g:3,y:2,n:1};if(!kb[k]||o[s]>o[kb[k]])kb[k]=s}));
  $('kb').innerHTML=['qwertyuiop','asdfghjkl','⏎zxcvbnm⌫'].map(r=>`<div>${[...r].map(k=>`<button data-k="${k}" class="${kb[k]||''}" style="${k==='⏎'||k==='⌫'?'min-width:60px':''}">${k}</button>`).join('')}</div>`).join('');
  $('kb').querySelectorAll('button').forEach(b=>b.onclick=()=>key(b.dataset.k));
  const s=load('stats',{p:0,w:0,streak:0});$('stats').textContent=`Played ${s.p} · Won ${s.w} · Streak ${s.streak}`}
function key(k){if(over)return;if(k==='⌫'||k==='backspace'){cur=cur.slice(0,-1)}else if(k==='⏎'||k==='enter'){
    if(cur.length!==answer.length){const r=$('board').children[rows.length];r.classList.add('shake');setTimeout(()=>r.classList.remove('shake'),400);return}
    rows.push(cur);const won=cur===answer;cur='';score(rows.at(-1)).forEach((s,i)=>tone(s==='g'?660:s==='y'?520:300,.08,'triangle',.06,i*.06));
    if(won||rows.length===6){over=true;const s=load('stats',{p:0,w:0,streak:0});s.p++;if(won){s.w++;s.streak++;s.best=Math.max(s.best||0,s.streak)}else s.streak=0;save('stats',s);
      $('msg').textContent=won?['Genius!','Magnificent!','Impressive!','Splendid!','Great!','Phew!'][rows.length-1]:`The word was ${answer.toUpperCase()}`}}
  else if(/^[a-z]$/.test(k)&&cur.length<answer.length)cur+=k;draw()}
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||e.ctrlKey||e.metaKey)return;key(e.key.toLowerCase())});
$('newg').onclick=()=>{newGame();$('newg').blur()};$('list').onchange=()=>{save('list',$('list').value);newGame();$('list').blur()};
$('edit').onclick=()=>{$('custom').hidden=!$('custom').hidden;$('cw').value=load('custom','')};
$('cwSave').onclick=()=>{save('custom',$('cw').value);fillLists();if(lists()['My words']){$('list').value='My words';save('list','My words')}$('custom').hidden=true;newGame()};
fillLists();newGame();
// world top 10: longest winning streak
worldBoard($('world'),'wordle-streak',{unit:' in a row',title:'🌍 World top 10 (longest streak)',getScore:()=>load('stats',{}).best||0});
</script></body></html>
