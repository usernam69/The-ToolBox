<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reaction duel</title><link rel="stylesheet" href="common.css">
<style>.arc-c{display:block;margin:8px auto;background:#111;border-radius:10px;max-width:100%;touch-action:none}.arc-hud{text-align:center;font-weight:700;margin:6px 0}#pads{display:flex;gap:8px;height:300px}#pads button{flex:1;font-size:24px;border-radius:16px;border:0;color:#fff;touch-action:manipulation}#mid{text-align:center;font-size:32px;font-weight:800;margin:10px}</style></head>
<body data-app="reaction" data-cat="games" data-title="Reaction duel"><main>
<p class="sub">Two players, one screen. Wait for GO, then tap your side (or press A / L). Too early and you lose the round. First to 5.</p>
<div id="mid">Tap Start</div><div id="pads"><button id="p0" style="background:#e5484d">Player 1<br><span>0</span></button><button id="p1" style="background:#3e63dd">Player 2<br><span>0</span></button></div><p style="text-align:center"><button class="b" id="go">Start</button></p>
<div id="world"></div>
</main><script src="common.js"></script><script src="scores.js"></script><script src="arcade.js"></script><script>
{
let st='idle',sc=[0,0],tm=null,goAt=0;
function round(){st='wait';$('mid').textContent='Wait…';tm=setTimeout(()=>{st='go';goAt=performance.now();$('mid').textContent='GO!';tone(880,.15,'square',.1)},1200+Math.random()*3000)}
function hit(p){if(st==='wait'){clearTimeout(tm);sc[1-p]++;$('mid').textContent=`Too early! Point to player ${2-p}`;show();return next()}
  if(st!=='go')return;st='idle';sc[p]++;$('mid').textContent=`Player ${p+1}: ${Math.round(performance.now()-goAt)} ms`;const ms=performance.now()-goAt;if(!load('best',0)||ms<load('best',0))save('best',Math.round(ms));show();next()}
function show(){[0,1].forEach(p=>$('p'+p).querySelector('span').textContent=sc[p])}
function next(){st='idle';if(sc[0]>=5||sc[1]>=5){ARC.report(sc[0]>=5?0:1);ARC.over(`🏆 Player ${sc[0]>=5?1:2} wins ${sc[0]}–${sc[1]}`,start);return}setTimeout(round,1500)}
function start(){ARC.hideOver();sc=[0,0];show();round()}
$('p0').onpointerdown=()=>hit(0);$('p1').onpointerdown=()=>hit(1);addEventListener('keydown',e=>{if(e.key==='a')hit(0);if(e.key==='l')hit(1)});$('go').onclick=start;
ARC.board('reaction',{lower:true,unit:' ms',title:'🌍 Fastest reactions'});
}
</script></body></html>
