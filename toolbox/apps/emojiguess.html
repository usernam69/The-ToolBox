<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Emoji app guess</title><link rel="stylesheet" href="common.css">
<style>.arc-c{display:block;margin:8px auto;background:#111;border-radius:10px;max-width:100%;touch-action:none}.arc-hud{text-align:center;font-weight:700;margin:6px 0}#q{font-size:64px;text-align:center}#hint{text-align:center;font:20px monospace;letter-spacing:3px}#opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:460px;margin:10px auto}</style></head>
<body data-app="emojiguess" data-cat="games" data-title="Emoji app guess"><main>
<p class="sub">Which ToolBox app is this? Guess from its emoji and a few letters. 10 rounds.</p>
<script src="registry.js"></script><p class="arc-hud" id="hud"></p><div id="q"></div><p id="hint"></p><div id="opts"></div>
<div id="world"></div>
</main><script src="common.js"></script><script src="scores.js"></script><script src="arcade.js"></script><script>
{
let round,score,ans;const apps=ALL_APPS.filter(a=>a.cat!=='community'&&a.cat!=='arcade');
function next(){if(round>=10){const r=ARC.best(score);return ARC.over(`🤔 ${score}/10${r.isNew?' · new best!':''}`,start)}round++;const opts=ARC.shuffle(apps).slice(0,4);ans=opts[0];
  $('q').textContent=ans.emoji;$('hint').textContent=ans.name.replace(/[A-Za-z]/g,(c,i)=>i%3===0?c:'_');$('hud').textContent=`Round ${round}/10 · score ${score}`;
  $('opts').innerHTML=ARC.shuffle(opts).map(o=>`<button class="g" data-id="${o.id}">${esc(o.name)}</button>`).join('')}
function start(){ARC.hideOver();round=0;score=0;next()}
$('opts').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;if(b.dataset.id===ans.id){score++;tone(800,.08)}else tone(160,.2,'sawtooth',.06);next()};start();ARC.board('emojiguess',{unit:'/10'});
}
</script></body></html>
