<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open with The ToolBox</title><link rel="stylesheet" href="common.css">
<style>.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.apps button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:12px;font:inherit;cursor:pointer}.apps button:hover{border-color:var(--accent)}.apps .e{font-size:28px}
#drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center}</style></head>
<body data-app="open" data-cat="tools" data-title="Open with The ToolBox"><main>
<div id="what" class="sub">Pick a file, drop one here, or use <b>Open with → The ToolBox</b> or <b>Share → The ToolBox</b> in the Files app once The ToolBox is installed.</div>
<div id="drop"><label class="b" style="cursor:pointer">Choose a file<input type="file" id="pick" multiple hidden></label><p class="muted">or drag it here</p></div>
<h3 id="h" hidden>Open it in…</h3><div class="apps" id="targets"></div>
</main><script src="common.js"></script><script>
// [label, emoji, page, input id, kinds]
const TARGETS=[
 ['Pixel art editor','👾','pixel.html','open',['image']],['ASCII art','🔤','ascii.html','file',['image']],['Your desk as a level','📸','desklevel.html','file',['image']],
 ['Colors from image','🎨','../tools.html#imgcolors','icFile',['image']],['Image resizer','🖼️','../tools.html#images','imFiles',['image']],['Website photo','🌐','website.html','photo',['image']],
 ['PDF merger','📄','../tools.html#pdf','pdfFiles',['pdf']],['Soundboard','🔊','soundboard.html','file',['audio']],['Audio trimmer','✂️','../tools.html#audio','auFile',['audio','video']],
 ['GIF maker','🎞️','../tools.html#gif','gfFile',['video']],['Community apps','🧩','community.html','file',['html']],['Voxel world','⛏️','voxel.html','vxImport',['json']],
 ['Restore a backup','💾','../tools.html#backup','bkImport',['json']],['Link saver','🔗','../tools.html#links','lUrl',['url']],['Journal','📓','journal.html','a',['text']],['Sticky note','🗒️','sticky.html',null,['text','url']]];
const kind=f=>f.type.startsWith('image/')?'image':f.type==='application/pdf'?'pdf':f.type.startsWith('audio/')?'audio':f.type.startsWith('video/')?'video':/\.html?$/i.test(f.name)?'html':/\.json$/i.test(f.name)?'json':'other';
async function offer(files,text){const kinds=new Set(files?files.map(kind):[]);let t=text;
  if(t!=null){kinds.add('text');if(/https?:\/\/\S+/.test(t))kinds.add('url')}
  const list=TARGETS.filter(x=>x[4].some(k=>kinds.has(k)));$('h').hidden=!list.length;
  $('what').innerHTML=files?`<b>${files.length===1?esc(files[0].name):files.length+' files'}</b>`:`<b>Shared text:</b> ${esc(String(t).slice(0,200))}`;
  $('targets').innerHTML=list.map((x,i)=>`<button data-i="${TARGETS.indexOf(x)}"><span class="e">${x[1]}</span><b>${esc(x[0])}</b></button>`).join('')||'<p class="muted">No ToolBox app opens this kind of file yet.</p>';
  $('targets').querySelectorAll('button').forEach(b=>b.onclick=async()=>{const[,, page,input]=TARGETS[b.dataset.i];
    if(!input){const n=loadSticky();n.push({id:uid(),x:60+rnd(200),y:60+rnd(120),c:rnd(5),t:String(t).slice(0,2000)});localStorage.setItem('app_sticky_notes',JSON.stringify(n));location.href=page;return}
    await HANDOFF.put(files?{files}:{text:input==='lUrl'?(String(t).match(/https?:\/\/\S+/)||[t])[0]:String(t)});const[p,h]=page.split('#');location.href=p+'?handoff='+input+(h?'#'+h:'')})}
function loadSticky(){try{return JSON.parse(localStorage.getItem('app_sticky_notes'))||[]}catch{return[]}}
$('pick').onchange=()=>{const f=[...$('pick').files];if(f.length)offer(f)};
$('drop').ondragover=e=>{e.preventDefault()};$('drop').ondrop=e=>{e.preventDefault();const f=[...e.dataTransfer.files];if(f.length)offer(f)};
// "Open with" from the Files app (installed app only)
if('launchQueue' in window)launchQueue.setConsumer(async p=>{if(p.files&&p.files.length)offer(await Promise.all(p.files.map(h=>h.getFile())))});
// "Share to" from other apps: text comes in the address, files come through the offline helper (sw.js)
const q=new URLSearchParams(location.search);
if(q.get('shared')==='files'){caches.open('toolbox-share').then(async c=>{const keys=await c.keys(),files=[];for(const k of keys){const r=await c.match(k);files.push(new File([await r.blob()],decodeURIComponent(r.headers.get('x-name')||'shared'),{type:r.headers.get('content-type')||''}));await c.delete(k)}if(files.length)offer(files)})}
else if(q.get('text')||q.get('url')||q.get('title')){offer(null,[q.get('title'),q.get('text'),q.get('url')].filter(Boolean).join(' '))}
</script><script src="handoff.js"></script></body></html>
