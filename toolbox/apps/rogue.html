<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tiny roguelike</title><link rel="stylesheet" href="common.css">
<style>#c{width:100%;max-width:960px;aspect-ratio:48/26;background:#0b0d12;border-radius:12px;margin:auto;image-rendering:pixelated}#log{height:84px;overflow:auto;font-size:14px;margin-top:6px}#log div:first-child{font-weight:600}.hud{display:flex;gap:14px;flex-wrap:wrap;font-weight:600}</style></head>
<body data-app="rogue" data-cat="games" data-title="Tiny roguelike"><main>
<div class="hud"><span id="hp"></span><span id="st"></span><span id="dp"></span><span id="gd"></span><span class="muted" id="best" style="margin-left:auto"></span><button class="g" id="new">New run</button></div>
<canvas id="c" width="960" height="520"></canvas>
<div class="touchpad" id="pad"><button data-m="-1,0">◀</button><button data-m="0,-1">▲</button><button data-m="0,1">▼</button><button data-m="1,0">▶</button><button data-m="0,0" title="Wait">⏳</button></div>
<div id="log" class="box"></div>
<p class="muted" style="font-size:13px">Arrow keys or WASD to move, and bump into a monster to fight it. <kbd>.</kbd> waits a turn. Find the ▼ stairs to go deeper. ❤️ heals, 🗡️ makes you stronger, 🛡️ makes you tougher. How deep can you get?</p>
</main><script src="common.js"></script><script>
const W=48,H=26,TS=20,c=$('c'),x=c.getContext('2d');let g;
const MON=[{n:'rat',e:'🐀',hp:3,atk:1,d:1},{n:'bat',e:'🦇',hp:4,atk:2,d:1},{n:'goblin',e:'👺',hp:7,atk:3,d:2},{n:'skeleton',e:'💀',hp:10,atk:4,d:3},{n:'orc',e:'👹',hp:15,atk:5,d:4},{n:'ghost',e:'👻',hp:12,atk:6,d:5},{n:'dragon',e:'🐉',hp:30,atk:8,d:7}];
function log(m){g.log.unshift(m);$('log').innerHTML=g.log.slice(0,30).map(l=>`<div>${l}</div>`).join('')}
function newRun(){g={depth:0,hp:20,max:20,atk:3,def:0,gold:0,log:[],dead:false};level();log('You step into the dungeon. Good luck!')}
function level(){g.depth++;const m=[...Array(H)].map(()=>Array(W).fill('#')),rooms=[];
  for(let t=0;t<200&&rooms.length<9;t++){const w=5+rnd(8),h=4+rnd(5),rx=1+rnd(W-w-2),ry=1+rnd(H-h-2);if(rooms.some(r=>rx<r.x+r.w+1&&rx+w+1>r.x&&ry<r.y+r.h+1&&ry+h+1>r.y))continue;
    rooms.push({x:rx,y:ry,w,h});for(let j=ry;j<ry+h;j++)for(let i=rx;i<rx+w;i++)m[j][i]='.'}
  const ctr=r=>[r.x+(r.w>>1),r.y+(r.h>>1)];for(let i=1;i<rooms.length;i++){let[ax,ay]=ctr(rooms[i-1]);const[bx,by]=ctr(rooms[i]);while(ax!==bx){m[ay][ax]='.';ax+=Math.sign(bx-ax)}while(ay!==by){m[ay][ax]='.';ay+=Math.sign(by-ay)}}
  g.map=m;g.seen=[...Array(H)].map(()=>Array(W).fill(false));const free=()=>{let p;do{const r=pick(rooms);p=[r.x+rnd(r.w),r.y+rnd(r.h)]}while(g.ents?.some(e=>e.x===p[0]&&e.y===p[1])||(g.px===p[0]&&g.py===p[1]));return p};
  g.ents=[];[g.px,g.py]=ctr(rooms[0]);const st=free();g.stairs={x:st[0],y:st[1]};
  const pool=MON.filter(mm=>mm.d<=g.depth+1);for(let i=0;i<3+g.depth*1.5;i++){const t=pick(pool),[ex,ey]=free();g.ents.push({...t,x:ex,y:ey,mon:true,hp:t.hp+g.depth})}
  for(let i=0;i<2+rnd(3);i++){const[ex,ey]=free();g.ents.push({x:ex,y:ey,item:pick(['potion','potion','gold','gold','sword','shield'])})}
  look();draw();if(g.depth>1)log(`You go down to depth ${g.depth}.`)}
function look(){for(let j=-6;j<=6;j++)for(let i=-6;i<=6;i++){if(i*i+j*j>38)continue;const tx=g.px+i,ty=g.py+j;if(tx<0||ty<0||tx>=W||ty>=H)continue;
  // simple line of sight
  let ok=true;const n=Math.max(Math.abs(i),Math.abs(j));for(let k=1;k<n;k++){const sx=Math.round(g.px+i*k/n),sy=Math.round(g.py+j*k/n);if(g.map[sy][sx]==='#'){ok=false;break}}if(ok)g.seen[ty][tx]=2}}
const vis=(tx,ty)=>g.seen[ty][tx]===2;
function turn(dx,dy){if(g.dead)return;g.seen.forEach(r=>r.forEach((v,i)=>{if(v===2)r[i]=1}));
  const nx=g.px+dx,ny=g.py+dy,e=g.ents.find(e=>e.x===nx&&e.y===ny);
  if(dx||dy){if(e&&e.mon){const d=Math.max(1,g.atk+rnd(3)-1);e.hp-=d;tone(220,.06,'square',.06);log(`You hit the ${e.n} for ${d}.`);if(e.hp<=0){g.ents=g.ents.filter(o=>o!==e);g.gold+=rnd(3)+g.depth;log(`The ${e.n} ${e.e} is defeated!`)}}
    else if(g.map[ny][nx]!=='#'){g.px=nx;g.py=ny;if(e&&e.item){g.ents=g.ents.filter(o=>o!==e);
      if(e.item==='potion'){const h=Math.min(g.max-g.hp,8+g.depth);g.hp+=h;log(`❤️ You drink a potion (+${h} HP).`)}else if(e.item==='gold'){const n=5+rnd(10)*g.depth;g.gold+=n;log(`💰 ${n} gold!`)}
      else if(e.item==='sword'){g.atk++;log('🗡️ A sharper sword! Attack +1.')}else{g.def++;g.max+=3;g.hp+=3;log('🛡️ Sturdier armour! Defence +1, max HP +3.')}tone(880,.08,'triangle',.08)}
      if(nx===g.stairs.x&&ny===g.stairs.y){tone(440,.15,'sine',.1);tone(330,.2,'sine',.1,.12);level();return}}}
  // monsters act
  for(const m of g.ents.filter(e=>e.mon)){const dist=Math.abs(m.x-g.px)+Math.abs(m.y-g.py);if(dist===1){const d=Math.max(0,m.atk+rnd(3)-1-g.def);g.hp-=d;log(d?`The ${m.n} hits you for ${d}.`:`The ${m.n} misses.`);if(d)tone(140,.08,'sawtooth',.06)}
    else if(dist<9&&vis(m.x,m.y)){const opts=[[Math.sign(g.px-m.x),0],[0,Math.sign(g.py-m.y)]].filter(([a,b])=>(a||b)&&g.map[m.y+b][m.x+a]!=='#'&&!g.ents.some(o=>o.x===m.x+a&&o.y===m.y+b)&&!(m.x+a===g.px&&m.y+b===g.py));
      if(opts.length){const[a,b]=opts[Math.abs(g.px-m.x)>Math.abs(g.py-m.y)?0:opts.length-1];m.x+=a;m.y+=b}}}
  if(g.hp<=0){g.dead=true;g.hp=0;const sc=g.depth*100+g.gold,b=load('best',0);if(sc>b)save('best',sc);log(`☠️ You died at depth ${g.depth} with ${g.gold} gold. Score ${sc}. Press New run.`);tone(100,.6,'sawtooth',.1)}
  look();draw()}
function draw(){x.fillStyle='#0b0d12';x.fillRect(0,0,960,520);x.textAlign='center';x.textBaseline='middle';x.font='15px system-ui';
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const s=g.seen[j][i];if(!s)continue;x.globalAlpha=s===2?1:.35;x.fillStyle=g.map[j][i]==='#'?'#3a3f4b':'#1c2029';x.fillRect(i*TS,j*TS,TS,TS);if(g.map[j][i]==='.'){x.fillStyle='#2a303c';x.fillRect(i*TS+9,j*TS+9,2,2)}}
  x.globalAlpha=1;if(g.seen[g.stairs.y][g.stairs.x]){x.fillStyle='#ffd54f';x.fillText('▼',g.stairs.x*TS+10,g.stairs.y*TS+11)}
  g.ents.forEach(e=>{if(!vis(e.x,e.y))return;x.fillText(e.mon?e.e:{potion:'❤️',gold:'💰',sword:'🗡️',shield:'🛡️'}[e.item],e.x*TS+10,e.y*TS+11)});
  x.fillText(g.dead?'☠️':'🧙',g.px*TS+10,g.py*TS+11);
  $('hp').innerHTML=`❤️ ${g.hp}/${g.max}`;$('st').textContent=`🗡️ ${g.atk}  🛡️ ${g.def}`;$('dp').textContent=`Depth ${g.depth}`;$('gd').textContent=`💰 ${g.gold}`;$('best').textContent=`Best score ${load('best',0)}`}
const KM={arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],'.':[0,0]};
addEventListener('keydown',e=>{const m=KM[e.key.toLowerCase()];if(m){e.preventDefault();turn(...m)}});
$('pad').querySelectorAll('button').forEach(b=>b.onclick=()=>turn(...b.dataset.m.split(',').map(Number)));$('new').onclick=()=>{newRun();$('new').blur()};newRun();
</script></body></html>
