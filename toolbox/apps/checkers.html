<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkers</title><link rel="stylesheet" href="common.css">
<style>.arc-c{display:block;margin:8px auto;background:#111;border-radius:10px;max-width:100%;touch-action:none}.arc-hud{text-align:center;font-weight:700;margin:6px 0}#ck{display:grid;grid-template-columns:repeat(8,1fr);max-width:420px;margin:auto;border:3px solid #6b4f2a}#ck div{aspect-ratio:1;display:flex;align-items:center;justify-content:center}#ck .d{background:#7a5232;cursor:pointer}#ck .l{background:#e8d0a9}#ck .s{outline:3px solid #2fb344;outline-offset:-3px}#ck .t{box-shadow:inset 0 0 0 4px #ffd400}#ck span{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.4)}</style></head>
<body data-app="checkers" data-cat="games" data-title="Checkers"><main>
<p class="sub">Jump your opponent’s pieces. Jumps are required, and more jumps can follow. Reach the far side to make a king. On this screen, against the computer, or online.</p>
<div class="row" style="justify-content:center"><select id="mode"><option value="cpu">vs computer</option><option value="local">2 players here</option><option value="net">online</option></select><button class="b" id="go">New game</button></div><div id="room" hidden></div><p class="arc-hud" id="hud"></p><div id="ck"></div>
<div id="world"></div>
</main><script src="common.js"></script><script src="scores.js"></script><script src="arcade.js"></script><script>
{
// pieces: 1 red, 2 black, +2 = king. Red moves up (toward row 0) and goes first.
let B,turn,sel=-1,chain=-1,me=1,over=false;
const R=ARC.room('checkers',m=>{if(m.t==='mv'){go(m.i,m.j,true)}if(m.t==='new'){reset();me=2;draw()}},{onJoin:()=>{if(R.host){reset();me=1;R.send({t:'new'});draw()}}});
function reset(){ARC.hideOver();B=Array(64).fill(0);for(let i=0;i<64;i++){const y=i/8|0;if(((i%8)+y)%2){if(y<3)B[i]=2;if(y>4)B[i]=1}}turn=1;sel=-1;chain=-1;over=false}
const side=p=>p?(p-1)%2+1:0,king=p=>p>2;
function moves(i,jumpsOnly){const p=B[i],x=i%8,y=i/8|0,dirs=king(p)?[-1,1]:side(p)===1?[-1]:[1],out=[];
  for(const dy of dirs)for(const dx of[-1,1]){const a=x+dx,b=y+dy;if(a<0||a>7||b<0||b>7)continue;const j=b*8+a;if(!B[j]){if(!jumpsOnly)out.push({j,cap:-1})}else if(side(B[j])!==side(p)){const a2=a+dx,b2=b+dy;if(a2>=0&&a2<8&&b2>=0&&b2<8&&!B[b2*8+a2])out.push({j:b2*8+a2,cap:j})}}return out}
function legalFor(t){const all=[];B.forEach((p,i)=>{if(side(p)===t)moves(i).forEach(m=>all.push({i,...m}))});const caps=all.filter(m=>m.cap>=0);return caps.length?caps:all}
function opts(i){if(chain>=0&&i!==chain)return[];const L=chain>=0?moves(i,true).map(m=>({i,...m})):legalFor(turn).filter(m=>m.i===i);return L}
function go(i,j,remote){const m=opts(i).find(m=>m.j===j);if(!m)return false;const mode=$('mode').value;if(mode==='net'&&!remote)R.send({t:'mv',i,j});
  B[j]=B[i];B[i]=0;if(m.cap>=0)B[m.cap]=0;tone(m.cap>=0?700:400,.05);let crowned=false;if(B[j]===1&&j<8){B[j]=3;crowned=true}if(B[j]===2&&j>55){B[j]=4;crowned=true}
  if(m.cap>=0&&!crowned&&moves(j,true).length){chain=j;sel=j}else{chain=-1;sel=-1;turn=3-turn}draw();if(mode==='cpu'&&turn===2&&!over)setTimeout(cpu,400);return true}
function cpu(){const L=legalFor(2);if(!L.length)return;const best=L.map(m=>({m,v:(m.cap>=0?5:0)+(m.j>55?3:0)+Math.random()})).sort((a,b)=>b.v-a.v)[0].m;go(best.i,best.j)}
function draw(){const t=sel>=0?opts(sel).map(m=>m.j):[];$('ck').innerHTML=B.map((p,i)=>`<div data-i="${i}" class="${((i%8)+(i/8|0))%2?'d':'l'} ${i===sel?'s':''} ${t.includes(i)?'t':''}">${p?`<span style="background:${side(p)===1?'#e5484d':'#222'};color:#ffd400">${king(p)?'♛':''}</span>`:''}</div>`).join('');
  const L=legalFor(turn),mode=$('mode').value;if(!L.length&&!over){over=true;const w=3-turn;if(w===me&&mode!=='local'){save('wins',load('wins',0)+1);ARC.best(load('wins',0))}ARC.over((w===1?'🔴 Red':'⚫ Black')+' wins!',()=>{reset();if(mode==='net')R.send({t:'new'});me=1;draw()})}
  $('hud').textContent=over?'':(mode==='net'?(turn===me?'Your turn':'Their turn'):(turn===1?'🔴 Red':'⚫ Black')+' to move')+(chain>=0?' · keep jumping!':'')}
$('ck').onclick=e=>{const d=e.target.closest('[data-i]');if(!d||over)return;const i=+d.dataset.i,mode=$('mode').value;if(mode==='net'&&turn!==me)return;if(mode==='cpu'&&turn!==1)return;
  if(sel>=0&&go(sel,i))return;if(chain<0&&side(B[i])===turn&&opts(i).length){sel=i;draw()}};
$('go').onclick=()=>{reset();me=1;if($('mode').value==='net')R.send({t:'new'});draw()};$('mode').onchange=()=>{$('room').hidden=$('mode').value!=='net';me=1;reset();draw()};reset();draw();ARC.board('checkers',{key:'wins',unit:' wins'});
}
</script></body></html>
