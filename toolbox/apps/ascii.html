<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ASCII art</title><link rel="stylesheet" href="common.css">
<style>#out{font:10px/1 ui-monospace,Consolas,monospace;white-space:pre;overflow:auto;max-height:70vh;letter-spacing:0}</style></head>
<body data-app="ascii" data-cat="quick" data-title="ASCII art"><main>
<div class="row"><label><input type="radio" name="m" value="img" checked> From a picture</label><label><input type="radio" name="m" value="txt"> Big text banner</label></div>
<div id="imgOpts" class="row"><input type="file" id="file" accept="image/*"><label>Width <input id="w" type="range" min="30" max="200" value="100"></label><select id="set"><option value=" .:-=+*#%@">Classic</option><option value=" ░▒▓█">Blocks</option><option value=" .'`^,:;Il!i><~+_-?][}{1)(|tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$">Detailed</option></select><label><input type="checkbox" id="inv"> Invert</label></div>
<div id="txtOpts" class="row" hidden><input id="txt" value="HELLO" maxlength="20" class="grow"><input id="ch" value="#" maxlength="1" style="width:50px" title="Character to draw with"></div>
<div class="row"><button class="g" id="cp">Copy</button><button class="g" id="dl">Save .txt</button><label>Text size <input id="fs" type="range" min="4" max="16" value="10"></label></div>
<pre id="out" class="box">Pick a picture to start.</pre>
</main><script src="common.js"></script><script>
let img=null;
function fromImage(){if(!img)return;const W=+$('w').value,H=Math.round(W*img.height/img.width*.5),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);
  const d=x.getImageData(0,0,W,H).data,s=$('set').value,inv=$('inv').checked;let out='';
  for(let y=0;y<H;y++){for(let i=0;i<W;i++){const p=(y*W+i)*4,l=(.299*d[p]+.587*d[p+1]+.114*d[p+2])/255*(d[p+3]/255)+(1-d[p+3]/255);let v=inv?l:1-l;out+=s[Math.min(s.length-1,Math.floor(v*s.length))]}out+='\n'}$('out').textContent=out}
function fromText(){const t=$('txt').value.toUpperCase()||' ',c=document.createElement('canvas'),x=c.getContext('2d');x.font='bold 16px monospace';const w=Math.ceil(x.measureText(t).width);c.width=w;c.height=18;
  x.font='bold 16px monospace';x.fillStyle='#000';x.textBaseline='top';x.fillText(t,0,1);const d=x.getImageData(0,0,w,18).data,ch=$('ch').value||'#';let out='';
  for(let y=0;y<18;y++){let line='';for(let i=0;i<w;i++)line+=d[(y*w+i)*4+3]>110?ch:' ';if(line.trim())out+=line.replace(/\s+$/,'')+'\n'}$('out').textContent=out}
const mode=()=>document.querySelector('[name=m]:checked').value;
function run(){$('imgOpts').hidden=mode()!=='img';$('txtOpts').hidden=mode()!=='txt';mode()==='img'?fromImage():fromText()}
$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;img=await createImageBitmap(f);run()};
document.querySelectorAll('[name=m],#w,#set,#inv,#txt,#ch').forEach(e=>e.addEventListener('input',run));
$('fs').oninput=()=>$('out').style.fontSize=$('fs').value+'px';$('cp').onclick=()=>copy($('out').textContent);$('dl').onclick=()=>download('ascii-art.txt',$('out').textContent);
</script></body></html>
