<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Secret: Pong</title><link rel="stylesheet" href="common.css">
<style>#c{width:100%;max-width:720px;aspect-ratio:16/10;display:block;margin:auto;background:#000;border-radius:12px;touch-action:none}</style></head>
<body data-app="secret" data-cat="games" data-title="🤫 Secret: Pong"><main>
<p class="sub">You found the secret app! First to 7 beats the computer. Move with ↑ ↓ (or W S), or drag on the screen.</p>
<canvas id="c" width="720" height="450"></canvas><p class="muted" id="best" style="text-align:center"></p>
</main><script src="common.js"></script><script>
// a hidden app: the menu opens it when you type the Konami code (↑↑↓↓←→←→BA)
save('found',load('found',0)||Date.now());
const c=$('c'),x=c.getContext('2d'),W=720,H=450,P=80;let me=H/2,cpu=H/2,b,sc=[0,0],last=performance.now(),touchY=null;
const serve=d=>{b={x:W/2,y:H/2,vx:300*d,vy:(Math.random()*2-1)*200}};serve(1);
c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){const r=c.getBoundingClientRect();touchY=(e.clientY-r.top)/r.height*H}});c.addEventListener('pointerup',()=>touchY=null);
function frame(t){const dt=Math.min(.03,(t-last)/1000);last=t;
  if(touchY!==null)me+=(touchY-me)*Math.min(1,dt*12);else me+=((keys.has('arrowdown')||keys.has('s'))-(keys.has('arrowup')||keys.has('w')))*420*dt;me=Math.max(P/2,Math.min(H-P/2,me));
  cpu+=Math.sign(b.y-cpu)*Math.min(Math.abs(b.y-cpu),300*dt);
  b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<8||b.y>H-8){b.vy*=-1;b.y=Math.max(8,Math.min(H-8,b.y));tone(300,.03,'square',.04)}
  const hit=(px,py)=>Math.abs(b.x-px)<14&&Math.abs(b.y-py)<P/2+8;
  if(b.vx<0&&hit(24,me)){b.vx=-b.vx*1.06;b.vy+=(b.y-me)*6;tone(520,.05,'square',.06)}if(b.vx>0&&hit(W-24,cpu)){b.vx=-b.vx*1.06;b.vy+=(b.y-cpu)*6;tone(440,.05,'square',.06)}
  if(b.x<-20||b.x>W+20){sc[b.x<0?1:0]++;tone(b.x<0?150:880,.2,'triangle',.08);if(sc.some(s=>s>=7)){const won=sc[0]>=7;toast(won?'🏆 You beat the computer!':'🤖 The computer wins. Again?');if(won)save('wins',load('wins',0)+1);sc=[0,0]}serve(b.x<0?1:-1)}
  x.fillStyle='#000';x.fillRect(0,0,W,H);x.fillStyle='#fff';for(let y=0;y<H;y+=30)x.fillRect(W/2-2,y,4,16);
  x.fillRect(16,me-P/2,10,P);x.fillRect(W-26,cpu-P/2,10,P);x.fillRect(b.x-7,b.y-7,14,14);x.font='bold 48px monospace';x.textAlign='center';x.fillText(sc[0],W/2-60,60);x.fillText(sc[1],W/2+60,60);
  $('best').textContent=load('wins',0)?`Wins against the computer: ${load('wins',0)}`:'';requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
