<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Charades</title><link rel="stylesheet" href="common.css">
<style>.arc-c{display:block;margin:8px auto;background:#111;border-radius:10px;max-width:100%;touch-action:none}.arc-hud{text-align:center;font-weight:700;margin:6px 0}#word{font-size:40px;font-weight:800;text-align:center;margin:20px 0;min-height:50px}#btns{display:flex;gap:10px;justify-content:center}#btns button{font-size:22px;padding:14px 26px}#teams{text-align:center;font-size:20px}</style></head>
<body data-app="charades" data-cat="games" data-title="Charades"><main>
<p class="sub">Act out the word without talking. Your team guesses. 60 seconds per turn. Tap ✓ when they get it, or skip.</p>
<div class="row" style="justify-content:center"><select id="cat"><option value="animals">Animals</option><option value="actions">Actions</option><option value="films">Films and shows</option><option value="jobs">Jobs</option><option value="mixed">Mix</option></select><button class="b" id="go">Start turn</button></div><p id="teams"></p><p class="arc-hud" id="hud"></p><div id="word"></div><div id="btns" hidden><button class="b" id="ok">✓ Got it</button><button class="g" id="skip">Skip</button></div>
<div id="world"></div>
</main><script src="common.js"></script><script src="scores.js"></script><script src="arcade.js"></script><script>
{
const W={animals:'elephant kangaroo penguin snake monkey giraffe octopus chicken frog crab owl shark bee horse rabbit lion dolphin spider',actions:'brushing teeth swimming baking a cake climbing a ladder walking a dog flying a kite riding a bike juggling ice skating painting a wall fishing playing guitar sneezing',films:'superhero space adventure pirates haunted house dinosaurs cooking show detective robot wizard school race car',jobs:'doctor firefighter chef teacher pilot astronaut farmer dentist builder painter magician hairdresser'};
const list=c=>(c==='mixed'?Object.values(W).join(' '):W[c]).match(c==='actions'||c==='mixed'?/[a-z]+(?: (?:a |the )?[a-z]+)?/g:/[a-z]+/g);
let team=0,sc=[0,0],end=0,got=0,word,run=false,pool=[];
function teams(){$('teams').textContent=`Team A ${sc[0]} · Team B ${sc[1]} · now: Team ${'AB'[team]}`}
function next(){if(!pool.length)pool=ARC.shuffle(list($('cat').value));word=pool.pop();$('word').textContent=word}
$('go').onclick=()=>{if(run)return;ARC.hideOver();run=true;got=0;end=Date.now()+60000;$('btns').hidden=false;next()};
$('ok').onclick=()=>{if(!run)return;got++;tone(880,.08,'triangle');next()};$('skip').onclick=()=>{if(run)next()};
setInterval(()=>{if(!run)return;const s=Math.ceil((end-Date.now())/1000);$('hud').textContent=s+'s · '+got+' guessed';if(s<=5&&s>0)tone(600,.04);if(s<=0){run=false;sc[team]+=got;$('btns').hidden=true;$('word').textContent='⏰ Time!';tone(220,.4,'square',.08);toast(`Team ${'AB'[team]} got ${got}`);team=1-team;teams()}},250);teams();
}
</script></body></html>
