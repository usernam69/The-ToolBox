<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The ToolBox</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#2f6fde">
<link rel="stylesheet" href="apps/common.css">
<style>
header.hero{max-width:1000px;margin:auto;padding:28px 16px 8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header.hero img{width:56px;height:56px}
header.hero h1{margin:0;font-size:30px}
header.hero p{margin:2px 0 0}
#q{flex:1;min-width:200px;max-width:340px;margin-left:auto}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.cat{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:18px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:transform .12s,box-shadow .12s}
.cat:hover,.cat:focus-visible{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12);outline:none;border-color:var(--accent)}
.cat .e{font-size:40px;line-height:1}
.cat h2{font-size:20px;margin:8px 0 2px}
.cat .n{font-size:13px;color:var(--muted)}
.cat .peek{margin-top:10px;font-size:22px;letter-spacing:4px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.app{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;text-decoration:none;color:var(--ink);transition:border-color .12s}
.app:hover,.app:focus-visible{border-color:var(--accent);outline:none}
.app .e{font-size:30px;line-height:1.1}
.app b{display:block}
.app span{font-size:13px;color:var(--muted)}
.back{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.crumb{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.crumb h2{font-size:24px;margin:0}
#recent{margin-bottom:18px}
#recent .row a{font-size:14px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;text-decoration:none;color:var(--ink);background:var(--card)}
.chip:hover{border-color:var(--accent)}
.app{position:relative}.fav{position:absolute;top:6px;right:8px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--warn);padding:2px}
#menuBar{max-width:1000px;margin:0 auto;padding:4px 16px 0}
.news{margin-bottom:16px;position:relative}.news .x{position:absolute;top:8px;right:8px}
#banner{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:50;max-width:calc(100vw - 32px)}
.qrd{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);max-width:min(360px,calc(100vw - 32px));text-align:center}.qrd svg{width:240px;height:240px;background:#fff;border-radius:8px}
#menuPet{position:fixed;left:0;bottom:6px;font-size:34px;text-decoration:none;z-index:40}#menuPet .body{display:inline-block}#menuPet .say{position:absolute;bottom:44px;left:0;white-space:nowrap;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 8px}#menuPet .say:empty{display:none}
#season{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}#season span{position:absolute;top:-30px;animation:fall linear infinite;opacity:.8}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
footer{padding-bottom:60px!important;max-width:1000px;margin:auto;padding:16px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="hero">
 <img src="icon.svg" alt="">
 <div><h1>The ToolBox</h1><p class="muted">Apps, games and tools, all in one place.</p></div>
 <input id="q" placeholder="Search all apps…" autocomplete="off">
</header>
<main>
 <div id="recent"></div>
 <div id="home"><div class="cats" id="cats"></div></div>
 <div id="catView" hidden><div class="crumb"><button class="back" id="backBtn">← All categories</button><h2 id="catTitle"></h2></div><p class="sub" id="catBlurb"></p><div class="apps" id="catApps"></div></div>
 <div id="searchView" hidden><h2 style="margin-bottom:10px">Search results</h2><div class="apps" id="searchApps"></div></div>
</main>
<footer>Everything is saved on this device only. <span id="count"></span></footer>
<script src="apps/registry.js"></script>
<script src="apps/i18n.js"></script>
<script>I18N.applyRegistry()</script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const t=JSON.parse(localStorage.getItem('tb_theme')||'"auto"');if(t!=='auto')document.documentElement.dataset.theme=t;
  const a=JSON.parse(localStorage.getItem('tb_accent')||'""');if(a)document.documentElement.style.setProperty('--accent',a)}catch{}
const card=a=>`<a class="app" href="${esc(a.href)}" data-id="${a.id}"><span class="e">${a.emoji}</span><div><b>${esc(a.name)}</b><span>${esc(a.desc)}</span></div></a>`;
function remember(e){const a=e.target.closest('.app,.chip');if(!a||!a.dataset.id)return;
  try{const r=JSON.parse(localStorage.getItem('menu_recent')||'[]');localStorage.setItem('menu_recent',JSON.stringify([a.dataset.id,...r.filter(x=>x!==a.dataset.id)].slice(0,8)))}catch{}}
document.addEventListener('click',remember);
$('cats').innerHTML=CATEGORIES.map(c=>`<button class="cat" data-cat="${c.id}"><div class="e">${c.emoji}</div><h2>${esc(c.name)}</h2><div class="n">${c.apps.length} ${c.id==='tools'?'shortcuts (64 tools inside)':'apps'}</div><p class="muted" style="margin:6px 0 0">${esc(c.blurb)}</p><div class="peek">${c.apps.slice(0,7).map(a=>a[2]).join('')}</div></button>`).join('');
$('cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{location.hash=b.dataset.cat});
$('backBtn').onclick=()=>{location.hash=''};
$('count').textContent=`${ALL_APPS.filter(a=>a.cat!=='tools').length} apps and games + 64 tools.`;
function drawRecent(){let r=[];try{r=JSON.parse(localStorage.getItem('menu_recent')||'[]')}catch{}
  const list=r.map(id=>ALL_APPS.find(a=>a.id===id)).filter(Boolean).slice(0,6);
  $('recent').innerHTML=list.length&&!location.hash?`<div class="muted" style="font-size:13px">Recently opened</div><div class="row">${list.map(a=>`<a class="chip" href="${esc(a.href)}" data-id="${a.id}">${a.emoji} ${esc(a.name)}</a>`).join('')}</div>`:''}
function route(){const id=location.hash.slice(1),c=CATEGORIES.find(c=>c.id===id);$('q').value='';$('searchView').hidden=true;
  $('home').hidden=!!c;$('catView').hidden=!c;
  if(c){$('catTitle').textContent=c.emoji+' '+c.name;$('catBlurb').textContent=c.blurb;$('catApps').innerHTML=c.apps.map(([id,name,emoji,desc,href])=>card({id,name,emoji,desc,href})).join('');scrollTo(0,0)}
  drawRecent()}
$('q').oninput=()=>{const q=$('q').value.trim().toLowerCase();if(!q){route();return}
  const hits=ALL_APPS.filter(a=>(a.name+' '+a.desc).toLowerCase().includes(q));
  $('home').hidden=$('catView').hidden=true;$('searchView').hidden=false;$('recent').innerHTML='';
  $('searchApps').innerHTML=hits.map(card).join('')||'<p class="muted">Nothing matches.</p>'};
$('q').onkeydown=e=>{if(e.key==='Enter'){const a=$('searchApps').querySelector('a');if(a)a.click()}if(e.key==='Escape'){$('q').value='';route()}};
addEventListener('hashchange',route);route();
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="apps/family-rules.js"></script>
<script src="js/menu.js"></script>
<script src="apps/remind.js"></script>
<script src="js/voice.js"></script>
<script>{const b=document.createElement('button');b.className='g';b.textContent='🔔';b.title='Reminders';b.setAttribute('aria-label','Reminders');b.onclick=REMIND.open;$('menuBar').append(b)}</script>
<script>I18N.watch();$('menuBar').append(I18N.picker())</script>
</body>
</html>
